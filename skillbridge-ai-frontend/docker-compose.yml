version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: skillbridge-postgres
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
    ports:
      - "5432:5432"
    volumes:
      - skillbridge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: skillbridge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: skillbridge-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: skillbridge-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - skillbridge-es-data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: skillbridge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001" # console UI
    volumes:
      - skillbridge-minio-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillbridge-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: skillbridge
      DB_USERNAME: skillbridge
      DB_PASSWORD: skillbridge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      ELASTICSEARCH_URI: http://elasticsearch:9200
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: skillbridge-uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000
      JWT_SECRET: local-dev-secret-change-in-production-min-32-bytes-long
      FRONTEND_OAUTH_REDIRECT_URI: http://localhost:3000/oauth2/callback
    ports:
      - "8080:8080"

volumes:
  skillbridge-postgres-data:
  skillbridge-es-data:
  skillbridge-minio-data:
